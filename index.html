<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MS Developer House Invoice Pro</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

body{
    margin:0;
    font-family:Poppins;
    background:#eef2f7;
}

.container{padding:20px; max-width:1300px; margin:auto;}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

h2{color:#1a73e8}

input,select,textarea{
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:10px;
    border:1px solid #ddd;
    outline:none;
}

button{
    background:#1a73e8;
    color:white;
    padding:12px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:10px;
}

.invoice{
    background:white;
    padding:30px;
    border-radius:15px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
}

th{
    background:#1a73e8;
    color:white;
}

.badge{
    padding:5px 10px;
    border-radius:20px;
    color:white;
}

.paid{background:green;}
.unpaid{background:red;}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h2>Create Invoice (MS Developer House)</h2>

<div class="grid">

<input id="name" placeholder="Customer Name">
<input id="phone" placeholder="Phone / Email">

<select id="service">
<option>Website</option>
<option>Domain</option>
<option>Hosting</option>
<option>SEO</option>
<option>App Development</option>
</select>

<input id="total" type="number" placeholder="Total Amount">

<input id="paid" type="number" placeholder="Paid Amount">

<select id="currency">
<option value="TK">TK</option>
<option value="USD">USD</option>
</select>

<select id="method">
<option>bKash</option>
<option>Nagad</option>
<option>Rocket</option>
<option>Bank Transfer</option>
<option>Binance</option>
<option>BEP20 (USDT)</option>
<option>Cash</option>
</select>

<input id="txn" placeholder="Transaction ID">

<input id="received" placeholder="Received Number / Sender">

<select id="status">
<option>Paid</option>
<option>Unpaid</option>
</select>

</div>

<textarea id="note" placeholder="Note (Domain / Hosting / Details)"></textarea>

<button onclick="create()">Create Invoice</button>

</div>

<div class="card" id="preview"></div>

</div>

<script>

let invoices = JSON.parse(localStorage.getItem("inv")) || [];

function create(){

let data = {
    id:"MSDH-"+Date.now(),
    name:document.getElementById("name").value,
    phone:document.getElementById("phone").value,
    service:document.getElementById("service").value,
    total:document.getElementById("total").value,
    paid:document.getElementById("paid").value,
    currency:document.getElementById("currency").value,
    method:document.getElementById("method").value,
    txn:document.getElementById("txn").value,
    received:document.getElementById("received").value,
    status:document.getElementById("status").value,
    note:document.getElementById("note").value,
    date:new Date().toLocaleString()
};

data.due = data.total - data.paid;

invoices.unshift(data);

localStorage.setItem("inv",JSON.stringify(invoices));

show(data);

}

function show(d){

document.getElementById("preview").innerHTML = `
<div id="pdf" class="invoice">

<h2>MS Developer House</h2>
<p>Invoice ID: ${d.id}</p>
<p>Date: ${d.date}</p>

<hr>

<h3>Customer</h3>
<p>${d.name}</p>
<p>${d.phone}</p>

<table>
<tr>
<th>Service</th>
<th>Total</th>
<th>Paid</th>
<th>Due</th>
<th>Currency</th>
</tr>

<tr>
<td>${d.service}</td>
<td>${d.total}</td>
<td>${d.paid}</td>
<td>${d.due}</td>
<td>${d.currency}</td>
</tr>

</table>

<br>

<h3>Payment Info</h3>
<p><b>Method:</b> ${d.method}</p>
<p><b>TXN ID:</b> ${d.txn}</p>
<p><b>Received:</b> ${d.received}</p>
<p><b>Status:</b> <span class="badge ${d.status=='Paid'?'paid':'unpaid'}">${d.status}</span></p>

<h3>Note</h3>
<p>${d.note}</p>

<h2 style="text-align:right;">Due: ${d.due} ${d.currency}</h2>

</div>

<br>

<button onclick="download()">Download PDF</button>
`;

}

function download(){

let element = document.getElementById("pdf");

html2pdf().from(element).save("invoice.pdf");

}

</script>

</body>
</html>
